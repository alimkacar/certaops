[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certaops"
version = "0.1.0"
description = "Policy-governed AI agent tools for safe, auditable SAP S/4HANA operations"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CertaOps contributors" }]
keywords = [
    "sap",
    "s4hana",
    "ai-agents",
    "odata",
    "human-in-the-loop",
    "policy-engine",
    "procurement",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Manufacturing",
    "Topic :: Office/Business",
]

# Runtime dependencies. Install with `python -m pip install .`.
dependencies = [
    # Varsayilan model saglayicisi: Google Gemini (resmi Gen AI SDK'si).
    "google-genai>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "tenacity>=8.3",
    "XlsxWriter>=3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "rich>=13.7",
]

[project.optional-dependencies]
# AGENT_AUTH_MODE=oidc icin. Kurulu degilse OIDC modu token KABUL ETMEZ.
oidc = ["pyjwt[crypto]>=2.8"]
# MODEL_PROVIDER=gemini varsayilandir ve cekirdek bagimliliktadir; bu extra
# yalniz aciklik icin vardir.
gemini = ["google-genai>=1.0"]
# MODEL_PROVIDER=anthropic kullanacaksaniz. Cekirdek runtime bu paketi
# ISTEMEZ; saglayici adaptoru import edilene kadar hic yuklenmez.
anthropic = ["anthropic>=0.40.0"]
# MCP sunucu cephesi (`certaops-mcp`). Cekirdek runtime bu paketi ISTEMEZ;
# tool'lari MCP istemcilerine acmak isteyenler icindir.
mcp = ["mcp>=1.0,<2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "anthropic>=0.40.0",
]

[project.scripts]
certaops = "certaops.cli:main"
certaops-mcp = "certaops.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Operator arayuzunun statik dosyalari wheel'e girer. Build adimi yoktur:
# vanilla JS/CSS, Node/npm bagimliligi yok.
[tool.setuptools.package-data]
robotics_agent = ["webui/*.html", "webui/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: gercek SAP sistemi gerektirir (SAP_INTEGRATION_TESTS=1)",
    "concurrency: paralel/coklu process yaris kosulu testleri",
    "privacy: D0-D3 siniflandirmasi, DLP ve saklama politikasi testleri",
    "performance: cache izolasyonu ve token/SAP-cagri butce kapilari",
]
filterwarnings = [
    "error::DeprecationWarning:robotics_agent.*",
]

[tool.coverage.run]
source = ["src/robotics_agent", "src/certaops"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # Tool description metinleri bilerek uzun; sema kalitesi satir uzunlugundan onemli.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117", "B011"]
# FastAPI'de `Depends()` / `Query()` varsayilan argumanda kullanmak standart idiomdur.
"src/robotics_agent/channels/api.py" = ["B008"]
"src/robotics_agent/channels/ui.py" = ["B008"]
